<!DOCTYPE html>
<html lang="es" class="validando-sesion">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reglamento · SEPA CUCEI</title>
  <!-- Fuentes e íconos de Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- Tailwind (estilos del diseño) y su configuración de colores -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-surface font-body-md text-on-surface antialiased" data-pagina="normatividad">

<!-- Encabezado con el usuario y el botón de salir (RF-91) -->
<header class="fixed top-0 w-full z-40 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="h-16 max-w-7xl mx-auto px-gutter flex items-center justify-between gap-space-md">
    <a href="estudiante.html" class="flex items-center gap-space-md">
      <span class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center">
        <span class="material-symbols-outlined text-on-primary text-[20px]">school</span>
      </span>
      <span class="hidden sm:flex flex-col">
        <span class="font-label-lg text-label-lg text-primary leading-tight">SEPA CUCEI</span>
        <span class="font-caption text-caption text-on-surface-variant leading-none">Universidad de Guadalajara · CUCEI</span>
      </span>
    </a>
    <!-- Enlaces, nombre y "Salir": los pinta app.js → pintarBarraEstudiante() -->
    <div id="barra-estudiante" data-actual="reglamento"></div>
  </div>
</header>

<!-- RF-81 a RF-88: consulta estática del reglamento. El texto vive en js/normatividad-contenido.js -->
<main class="w-full pt-24 pb-space-2xl min-h-[calc(100vh-6rem)]">
  <div class="w-full px-gutter">
    <div class="max-w-4xl mx-auto">
      <div class="mb-space-lg">
        <span class="font-label-md text-label-md uppercase tracking-wider text-secondary font-semibold">Normatividad</span>
        <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mt-1">Reglamento</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mt-1">Lo más importante del reglamento de evaluación de CUCEI, explicado en corto.</p>
        <div id="fuente" class="mt-space-sm"></div>
      </div>

      <!-- RF-82: índice de las secciones -->
      <nav id="indice" aria-label="Secciones del reglamento" class="flex flex-wrap gap-1 mb-space-lg"></nav>

      <div id="secciones" class="space-y-space-lg"></div>
    </div>
  </div>
</main>

<footer class="w-full bg-surface-container-lowest py-space-xl shadow-[0_-1px_8px_rgba(0,0,0,0.03)]">
  <div class="max-w-7xl mx-auto px-gutter flex flex-col items-center md:items-start">
    <p class="font-label-md text-label-md text-on-surface font-semibold">SEPA · Sistema de Evaluación de Progresión Académica</p>
    <p class="font-caption text-caption text-on-surface-variant">Centro Universitario de Ciencias Exactas e Ingenierías, Universidad de Guadalajara.</p>
  </div>
</footer>

<script src="js/app.js"></script>
<script src="js/normatividad-contenido.js"></script>
<script src="js/normatividad.js"></script>
</body>
</html>
